name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # AGENTS.md declares "Python 3.12+", so test the whole supported range
      # rather than only the floor. Stdlib-only, so this costs nothing to run.
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python3 test_unit.py

      - name: Integration smoke test
        run: python3 test_integration.py

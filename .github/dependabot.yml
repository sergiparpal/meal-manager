version: 2
updates:
  # This repository declares no dependencies to track. pyproject.toml exists but carries
  # tool configuration only — no [project] table, no requirements.txt, no package.json —
  # so there is nothing for the pip ecosystem to resolve and GitHub Actions is the only
  # ecosystem Dependabot can watch. Add a pip block here if real dependency metadata
  # (a [project] table or a requirements file) is ever introduced.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
